'use strict';
const $=s=>document.querySelector(s),app=$('#app');let tab='fill',unit='u1',exam=false,sound=true,queue=[],index=0,activeBlank=0,solved=false,mistakes=0,results=[],values=[],epoch=0;
const fills=[];function add(u,type,pic,lines,answers){fills.push({u,type,pic,lines,answers,id:u+'-'+fills.length})}

for(const [who,p,place,zh,icon] of workplaces)add('u1','在哪裡工作？',{kind:'work',who,zh,icon},[['Where ',0,' your '+who+' ',1,'?'],[p+' ',2,' '+(place==='farm'?'on':'in')+' a ',3,'.']],['does','work','works',place]);
for(const [job,zh,icon] of [['movie star','電影明星','🎬'],['vet','獸醫','🧑‍⚕️🐕'],['soccer player','足球員','⚽'],['inventor','發明家','💡']])add('u1','未來想做什麼？',{kind:'dream',who:'I',zh,icon},[['What ',0,' you want to ',1,' one day?'],['I ',2,' to be '+(job==='inventor'?'an':'a')+' ',3,'.']],['do','be','want',job]);
for(const [who,p,job,zh,icon] of [['brother','He','doctor','醫師','🧑‍⚕️'],['sister','She','artist','藝術家','🧑‍🎨'],['father','He','rock star','搖滾歌星','🎸'],['mother','She','bus driver','公車司機','🚌']])add('u1','家人想做什麼？',{kind:'dream',who,zh,icon},[['What ',0,' your '+who+' ',1,' to be?'],[p+' ',2,' to be '+(job==='artist'?'an':'a')+' ',3,'.']],['does','want','wants',job]);
for(let k=0;k<1;k++)add('u4','主動求助',{kind:'help',who:'Can you help?',zh:'迷路了，請人幫忙',icon:'🧑 🗺️ 🧑'},[['Can ',0,' help?'],['Sure. ',1,' can I ',2,'?']],['you','how','help']);
add('u4','回應求助',{kind:'help',who:'helper',zh:'回答我可以怎麼幫你',icon:'🤝'},[['Sure. ',0,' ',1,' I ',2,'?']],['how','can','help']);
for(const [place,zh,icon] of [['library','圖書館','📚'],['museum','博物館','🏺'],['train station','火車站','🚆'],['bookstore','書店','📖']])add('u4','詢問路線',{kind:'destination',zh,icon},[['How ',0,' I ',1,' to the ',2,'?'],['Go ',3,'.']],['can','get',place,'straight']);
for(let k=0;k<1;k++)add('u4','直走',{kind:'direction',command:'straight',zh:'直走',icon:'↑'},[['',0,' ',1,'.']],['go','straight']);
for(const road of ['Third Avenue','Second Avenue'])add('u4','在道路上轉彎',{kind:'direction',command:'left',zh:'左轉',road,icon:'↰'},[['Turn ',0,' ',1,' '+road+'.']],['left','on']);
for(const [place,zh,icon] of [['supermarket','超級市場','🛒'],['police station','警察局','🚓']])add('u4','在地標處轉彎',{kind:'direction',command:'right',zh:'右轉',landmark:zh,icon},[['Turn ',0,' ',1,' the ',2,'.']],['right','at',place]);
add('u4','在地標處左轉',{kind:'direction',command:'left',zh:'左轉',landmark:'書店',icon:'📖'},[['Turn ',0,' ',1,' the ',2,'.']],['left','at','bookstore']);
add('u4','在道路上右轉',{kind:'direction',command:'right',zh:'右轉',road:'First Avenue',icon:'↱'},[['Turn ',0,' ',1,' First Avenue.']],['right','on']);
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return s.normalize('NFKC').toLowerCase().replace(/[.,!?。！？]/g,'').replace(/\s+/g,' ').trim()}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function speak(s){if(!sound||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
function feedback(s){if($('#feedback'))$('#feedback').textContent=s}
function picture(p){let inside='';if(p.kind==='help')inside='<text x="95" y="125" font-size="62">🧑</text><text x="260" y="125" font-size="62">🧑</text><rect x="125" y="18" width="170" height="47" rx="15" fill="white"/><text x="210" y="49" text-anchor="middle" font-size="18">迷路了，請幫忙！</text><text x="210" y="122" text-anchor="middle" font-size="32">🗺️ ❓</text>';
else if(p.kind==='direction'){let path=p.command==='straight'?'M210 155V55':p.command==='left'?'M210 160V90H110':'M210 160V90H300';inside='<path d="M0 90H420 M210 0V200" stroke="#dddaca" stroke-width="40"/>';if(p.landmark)inside+='<rect x="'+(p.command==='left'?20:255)+'" y="113" width="135" height="70" rx="10" fill="#fffdf5"/><text x="'+(p.command==='left'?87:323)+'" y="146" text-anchor="middle" font-size="30">'+p.icon+'</text><text x="'+(p.command==='left'?87:323)+'" y="170" text-anchor="middle" font-size="15">'+p.landmark+'</text>';inside+='<path d="'+path+'" fill="none" stroke="#3c6d59" stroke-width="10" stroke-linejoin="round"/><path d="'+(p.command==='straight'?'M198 71l12-20 12 20':p.command==='left'?'M128 78l-20 12 20 12':'M282 78l20 12-20 12')+'" fill="none" stroke="#3c6d59" stroke-width="7"/>';if(p.road)inside+='<rect x="15" y="15" width="190" height="35" rx="8" fill="#3c6d59"/><text x="110" y="39" text-anchor="middle" font-size="18" fill="white">'+p.road+'</text>'}
else if(p.kind==='destination')inside='<text x="70" y="125" font-size="58">🧑</text><text x="180" y="115" font-size="34">→</text><rect x="250" y="28" width="145" height="145" rx="20" fill="white"/><text x="322" y="108" text-anchor="middle" font-size="52">'+p.icon+'</text><text x="322" y="146" text-anchor="middle" font-size="20">'+p.zh+'</text><text x="125" y="45" font-size="20">問路 ❓</text><text x="190" y="174" font-size="16">接著直走 ↑</text>';
else{inside='<text x="20" y="32" font-size="19" font-weight="700">'+p.who+'</text><text x="75" y="135" font-size="66">'+(p.who==='mother'||p.who==='sister'?'👩':'🧑')+'</text><text x="205" y="115" text-anchor="middle" font-size="32">'+(p.kind==='dream'?'💭':'→')+'</text><rect x="253" y="32" width="145" height="140" rx="23" fill="white"/><text x="325" y="105" text-anchor="middle" font-size="45">'+p.icon+'</text><text x="325" y="143" text-anchor="middle" font-size="19">'+p.zh+'</text><text x="100" y="177" text-anchor="middle" font-size="17">'+(p.kind==='dream'?'未來的願望':p.kind==='work'?'工作的地方':'現在的工作')+'</text>'}
return '<svg viewBox="0 0 420 200" role="img" aria-label="'+escapeText((p.who||'')+' '+(p.zh||'')+(p.landmark||'')+(p.road||''))+'"><rect width="420" height="200" rx="20" fill="#eaf0df"/>'+inside+'</svg>'}
const choices=[];function mc(u,q,options,a,why){choices.push({u,q,options,a,why})}
mc('u1','What ___ your father do?',['do','does','is'],'does','your father 是第三人稱單數，問句用 does。');
mc('u1','He ___ a farmer.',['am','are','is'],'is','He 搭配 is。');
mc('u1','Where does your mother ___?',['work','works','working'],'work','does 後面的動詞用原形 work。');
mc('u1','She ___ in a hospital.',['work','works','do'],'works','She 是第三人稱單數，肯定句用 works。');
mc('u1','What ___ you want to be one day?',['does','are','do'],'do','you 的問句用 do。');
mc('u1','I ___ to be a movie star.',['want','wants','am'],'want','I 搭配 want。');
mc('u1','What does your brother ___ to be?',['wants','want','is'],'want','does 後面的動詞用原形 want。');
mc('u1','He ___ to be a doctor.',['want','is','wants'],'wants','He 的肯定句用 wants。');
mc('u1','She is ___ artist.',['a','an','are'],'an','artist 開頭是母音音素，前面用 an。');
mc('u1','I want to ___ a vet.',['be','is','am'],'be','want to be 表示想成為。');
mc('u1','Where ___ your father work?',['do','is','does'],'does','your father 的問句用 does。');
mc('u1','What does your sister ___? She is a vet.',['does','do','is'],'do','What does + 人 + do? 用來詢問職業。');
mc('u4','Can you ___?',['helps','help','helping'],'help','Can 後接原形動詞 help。');
mc('u4','Sure. How ___ I help?',['can','am','does'],'can','How can I help? 表示我可以怎麼幫你？');
mc('u4','How can I ___ to the library?',['gets','getting','get'],'get','can 後接原形動詞 get。');
mc('u4','How can I get ___ the museum?',['to','at','on'],'to','get to + 地點，表示到達某地。');
mc('u4','Go ___.',['straight','left on','at'],'straight','Go straight. 表示直走。');
mc('u4','Turn left ___ Third Avenue.',['at','on','to'],'on','本單元用 on 接道路名稱。');
mc('u4','Turn right ___ the supermarket.',['to','on','at'],'at','at 接轉彎的地標。');
mc('u4','___ can I get to the train station?',['How','What','Who'],'How','How 問如何到達目的地。');
mc('u4','How can ___ get to the zoo?',['me','I','my'],'I','I 是句子的主詞。');
mc('u4','Turn ___ on Second Avenue.（左轉）',['right','straight','left'],'left','Turn left. 表示左轉。');
mc('u4','Turn ___ at the police station.（右轉）',['left','right','straight'],'right','Turn right. 表示右轉。');
mc('u4','___ you help?',['Can','Does','Is'],'Can','Can you help? 表示你能幫忙嗎？');
function settings(){return '<div class="settings"><label>練習單元 <select id="unit"><option value="u1" '+(unit==='u1'?'selected':'')+'>Unit 1 職業</option><option value="u4" '+(unit==='u4'?'selected':'')+'>Unit 4 問路</option><option value="both" '+(unit==='both'?'selected':'')+'>兩單元混合</option></select></label>'+(tab==='fill'?'<label><input type="checkbox" id="exam" '+(exam?'checked':'')+'> 考試模式（隱藏字母鍵盤與答案提示）</label><button id="print">🖨 列印空白考卷</button>':'')+'</div>'}
function switchTab(t){epoch++;tab=t;if('speechSynthesis'in window)speechSynthesis.cancel();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='map'){resetMap(true);return}startSet()}
function startSet(){queue=shuffle((tab==='fill'?fills:choices).filter(q=>unit==='both'||q.u===unit));index=0;results=[];renderQuestion()}
function renderQuestion(){solved=false;mistakes=0;let q=queue[index];values=tab==='fill'?q.answers.map(()=>''):[];activeBlank=0;app.innerHTML='<section class="panel">'+settings()+'<div class="top"><span class="pill">'+q.u.toUpperCase()+' · '+(tab==='fill'?q.type:'文法選擇')+'</span><span>'+(index+1)+' / '+queue.length+'</span></div><div class="track"><div class="bar" style="width:'+(index/queue.length*100)+'%"></div></div><div class="exercise" id="exercise"></div><div id="feedback" class="feedback" aria-live="polite">'+(tab==='fill'?'點選空格，再用字母鍵盤或實體鍵盤填答。':'選出正確答案。')+'</div><div id="nextarea" class="actions"></div></section>';$('#unit').onchange=e=>{unit=e.target.value;startSet()};if(tab==='fill'){$('#exam').onchange=e=>{exam=e.target.checked;renderQuestion()};$('#print').onclick=printExam;renderFill(q)}else renderChoice(q)}
function renderLines(q,printing=false){return q.lines.map(line=>'<div class="line">'+line.map(part=>typeof part==='number'?printing?'<span class="print-blank" style="width:'+Math.min(48,Math.max(16,q.answers[part].length*2.7))+'mm"></span>':'<input class="blank '+(part===0?'selected':'')+'" data-blank="'+part+'" id="blank'+part+'" aria-label="第 '+(part+1)+' 個空格" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="width:'+Math.min(280,Math.max(85,q.answers[part].length*14+24))+'px">':escapeText(part)).join('')+'</div>').join('')}
function renderFill(q){$('#exercise').innerHTML='<div class="pic">'+picture(q.pic)+'</div><div class="sentences">'+renderLines(q)+'</div>'+(exam?'<p class="sub">考試模式：所有空格保持空白，不提供字首與答案提示。使用實體或裝置鍵盤輸入。</p>':'<div class="keyboard"><div class="sub">完整 26 個字母，每個按鍵都能重複使用。多字詞請按空白鍵。</div><div class="keys">'+[...'abcdefghijklmnopqrstuvwxyz'].map(c=>'<button class="key" data-letter="'+c+'">'+c+'</button>').join('')+'</div><div class="keytools"><button data-edit="space">空白 Space</button><button data-edit="back">⌫ 刪除</button><button data-edit="clear">清除此格</button><button data-edit="next">下一個空格 →</button></div></div>')+'<div class="actions"><button class="primary" id="check">✓ 檢查答案</button>'+(!exam?'<button id="answerhint">顯示答案參考</button>':'')+'</div>';document.querySelectorAll('[data-blank]').forEach(e=>{e.onfocus=()=>selectBlank(+e.dataset.blank);e.oninput=()=>{values[+e.dataset.blank]=e.value};e.onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();checkFill()}}});document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>edit(b.dataset.letter));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));$('#check').onclick=checkFill;if(!exam)$('#answerhint').onclick=()=>{if(!solved){mistakes++;feedback('參考：'+q.answers.join(' / ')+'。請再自己輸入一次。')}}}
function selectBlank(n){activeBlank=n;document.querySelectorAll('[data-blank]').forEach(e=>e.classList.toggle('selected',+e.dataset.blank===n))}
function edit(command){if(solved)return;let e=$('#blank'+activeBlank);if(command==='next'){selectBlank((activeBlank+1)%values.length);return}let value=e.value;if(command==='clear')value='';else if(command==='back')value=value.slice(0,-1);else value+=command==='space'?' ':command;e.value=value;values[activeBlank]=value}
function checkFill(){if(solved)return;let q=queue[index];values=q.answers.map((_,i)=>$('#blank'+i).value);if(values.some(v=>!norm(v))){feedback('還有空格沒填完喔。');return}let wrong=q.answers.map((a,i)=>norm(a)===norm(values[i])?-1:i).filter(i=>i>=0);if(wrong.length){mistakes++;feedback('再檢查第 '+wrong.map(i=>i+1).join('、')+' 個空格的文法或拼字。');selectBlank(wrong[0]);return}solved=true;document.querySelectorAll('[data-blank]').forEach(e=>e.disabled=true);finishQuestion(q.lines.map(l=>l.map(p=>typeof p==='number'?q.answers[p]:p).join('')).join(' '))}
function renderChoice(q){let options=shuffle(q.options);$('#exercise').innerHTML='<p class="question">'+escapeText(q.q)+'</p><div class="choices">'+options.map((s,i)=>'<button data-option="'+i+'">'+s+'</button>').join('')+'</div>';document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{if(solved)return;if(options[+b.dataset.option]===q.a){solved=true;finishQuestion(q.q.replace('___',q.a),q.why)}else{mistakes++;b.disabled=true;feedback('再想想主詞、動詞或介系詞，試試其他答案。')}})}
function finishQuestion(s,why=''){results.push({q:queue[index],ok:mistakes===0});feedback('✅ 答對了！ '+s+(why?' '+why:''));if(!exam||tab==='choice')speak(s);$('#nextarea').innerHTML='<button id="next" class="primary">'+(index===queue.length-1?'看成果 ✨':'下一題 →')+'</button>';$('#next').onclick=()=>{index++;if(index===queue.length)summary();else renderQuestion()}}
function summary(){let count=results.filter(r=>r.ok).length;app.innerHTML='<section class="panel summary"><div style="font-size:65px">🏅</div><h2>這一輪完成了！</h2><b>'+count+' / '+queue.length+'</b><p>獨立一次答對</p><div class="actions" style="justify-content:center"><button id="again" class="primary">重新洗牌再練習</button><button id="retry" '+(count===queue.length?'disabled':'')+'>重練答錯與提示題</button></div></section>';$('#again').onclick=startSet;$('#retry').onclick=()=>{queue=shuffle(results.filter(r=>!r.ok).map(r=>r.q));results=[];index=0;renderQuestion()}}
function printExam(){let rows=shuffle(fills.filter(q=>unit==='both'||q.u===unit)),pages=[];for(let n=0;n<rows.length;n+=4){pages.push('<section class="print-page"><div class="print-head"><h2>Unit 1 & Unit 4 圖片文法填空</h2>班級：________　姓名：________　座號：_____　　看圖，完成句子。　第 '+(n/4+1)+' 頁</div><div class="print-grid">'+rows.slice(n,n+4).map((q,i)=>'<article class="print-card"><div class="print-n">'+(n+i+1)+'. '+q.u.toUpperCase()+' · '+q.type+'</div><div class="pic">'+picture(q.pic)+'</div><div class="sentences">'+renderLines(q,true)+'</div></article>').join('')+'</div></section>')};$('#print-area').innerHTML=pages.join('');window.print()}
// 地圖：3 條橫路、3 條直路，僅道路節點可走。
const buildingData=[['hospital','醫院','🏥'],['bakery','麵包店','🥐'],['restaurant','餐廳','🍽️'],['supermarket','超級市場','🛒'],['train station','火車站','🚆'],['toy store','玩具店','🧸'],['museum','博物館','🏺'],['movie theater','電影院','🎬'],['police station','警察局','🚓'],['park','公園','🌳'],['library','圖書館','📚'],['swimming pool','游泳池','🏊'],['mall','購物中心','🛍️'],['zoo','動物園','🦒'],['stadium','體育場','🏟️'],['bookstore','書店','📖']];
const av=['First Avenue','Second Avenue','Third Avenue'],st=['First Street','Second Street','Third Street'],delta=[[0,-1],[1,0],[0,1],[-1,0]],facing=['北 ↑','東 →','南 ↓','西 ←'],cmds={go:'Go straight.',left:'Turn left.',right:'Turn right.'};let buildings=[],person={x:0,y:8,d:0},target=0,mapMode='free',mapBusy=false,path=[],pathStep=0,history=[];
function isRoad(x,y){return x>=0&&x<=8&&y>=0&&y<=8&&(x%4===0||y%4===0)}
function move(s,c){if(c!=='go'){if(s.x%4!==0||s.y%4!==0)return null;return {...s,d:(s.d+(c==='left'?3:1))%4}}let [dx,dy]=delta[s.d],x=s.x+dx,y=s.y+dy;return isRoad(x,y)?{x,y,d:s.d}:null}
function route(s,t){let q=[[s,[]]],seen=new Set();for(let k=0;k<q.length;k++){let [v,r]=q[k],id=[v.x,v.y,v.d].join();if(seen.has(id))continue;seen.add(id);if(v.x===t.x&&v.y===t.y)return r;for(let c of ['go','left','right']){let n=move(v,c);if(n)q.push([n,[...r,c]])}}return []}
function layoutBuildings(){let source=shuffle(buildingData).slice(0,12),spots=[];for(let by of [0,4])for(let bx of [0,4]){spots.push({x:bx+1,y:by,cx:bx+1,cy:by+1.25},{x:bx+3,y:by,cx:bx+3,cy:by+1.25},{x:bx+2,y:by+4,cx:bx+2,cy:by+2.9})}buildings=source.map(([en,zh,icon],i)=>({en,zh,icon,...spots[i]}))}
function resetMap(rearrange=false){epoch++;if(rearrange||!buildings.length)layoutBuildings();person={x:0,y:8,d:0};path=route(person,buildings[target]);pathStep=0;mapBusy=false;history=[];renderMap()}
function instruction(){let c=path[pathStep];if(!c)return 'You are here!';if(c==='go')return 'Go straight.';let turn=c==='left'?'Turn left':'Turn right';return turn+' on '+(person.d%2===0?st[person.y/4]:av[person.x/4])+'.'}
function mapSvg(){let out='<svg viewBox="0 0 680 680" role="img" aria-label="三條橫路、三條直路的城市地圖，四個街區各有三棟建築"><rect width="680" height="680" rx="20" fill="#e8efdc"/>';for(let v of [80,340,600])out+='<path d="M'+v+' 30V650 M30 '+v+'H650" stroke="#d9d7c9" stroke-width="44"/><path d="M'+v+' 30V650 M30 '+v+'H650" stroke="#fffdf5" stroke-dasharray="10 10" stroke-width="2"/>';
for(let i=0;i<3;i++){let p=80+i*260;for(let x of [210,470])out+='<text x="'+x+'" y="'+(p+16)+'" text-anchor="middle" font-size="11" font-weight="650" fill="#465d50">'+st[i]+'</text>';for(let y of [210,470])out+='<text transform="translate('+(p+16)+','+y+') rotate(-90)" text-anchor="middle" font-size="11" font-weight="650" fill="#465d50">'+av[i]+'</text>'}
buildings.forEach((b,i)=>{let x=80+b.cx*65,y=80+b.cy*65,ex=80+b.x*65,ey=80+b.y*65;out+='<path d="M'+x+' '+y+'L'+ex+' '+ey+'" stroke="'+(i===target?'#b87c35':'#b9c6a9')+'" stroke-width="3" stroke-dasharray="5 3"/><rect x="'+(x-48)+'" y="'+(y-39)+'" width="96" height="78" rx="12" fill="#fffdf6" stroke="'+(i===target?'#c38c3c':'#c8d2bd')+'" stroke-width="'+(i===target?3:1)+'"/><text x="'+x+'" y="'+(y-6)+'" text-anchor="middle" font-size="28">'+b.icon+'</text>';b.en.split(' ').forEach((w,j)=>out+='<text x="'+x+'" y="'+(y+14+j*13)+'" text-anchor="middle" font-size="11" fill="#304f45">'+w+'</text>');out+='<circle cx="'+ex+'" cy="'+ey+'" r="5" fill="#a5b397"/>';if(i===target)out+='<circle cx="'+ex+'" cy="'+ey+'" r="15" fill="#efbc57" opacity=".55"/><path d="M'+ex+' '+ey+'v-30l22 7-22 8" stroke="#b77b31" stroke-width="2" fill="#b77b31"/>'});out+='<g id="avatar" class="avatar" style="transform:translate('+(80+person.x*65)+'px,'+(80+person.y*65)+'px)"><circle r="18" fill="#fffdf7" stroke="#376b57" stroke-width="2"/><g id="facearrow" style="transform:rotate('+(person.d*90)+'deg)"><path d="M0 -28l-7 9h14z" fill="#376b57"/></g><circle cy="-6" r="5" fill="#d6a075"/><path d="M-6 9V2q6-7 12 0v7" fill="#376b57"/><path d="M-3 9v5m6-5v5" stroke="#294e43" stroke-width="2"/></g></svg>';return out}
function renderMap(){let b=buildings[target];app.innerHTML='<div class="maplayout"><section class="panel"><div class="top"><span class="pill">3 橫路 × 3 直路 · 每區 3 棟</span><button id="rearrange">🔀 重排建築物</button></div><div class="mapbox">'+mapSvg()+'</div><p class="note">橘旗是目的地入口；虛線連到對應建築。每按一次直走，前進一小段。只在路口轉彎。小人的箭頭顯示面向。</p></section><section class="panel"><div class="settings"><label>模式 <select id="mapmode"><option value="free" '+(mapMode==='free'?'selected':'')+'>自己帶路</option><option value="follow" '+(mapMode==='follow'?'selected':'')+'>照指令走</option></select></label></div><label>目的地 <select id="destination">'+buildings.map((p,i)=>'<option value="'+i+'" '+(target===i?'selected':'')+'>'+p.en+'（'+p.zh+'）</option>').join('')+'</select></label><p class="question">How can I get to the '+b.en+'?</p><div class="pill" id="facing">面向 '+facing[person.d]+'</div><div id="instruction" class="instruction">'+(mapMode==='follow'?instruction():'Sure. How can I help?<br><span class="sub">請自己選擇直走、左轉或右轉。</span>')+'</div><div class="mapcontrols"><button data-command="left"><b>↶</b>Turn left<br>左轉</button><button data-command="go"><b>↑</b>Go straight<br>直走</button><button data-command="right"><b>↷</b>Turn right<br>右轉</button></div><div id="feedback" class="feedback" aria-live="polite">走到橘旗，就到目的地入口了！</div><div class="actions"><button id="routehint">💡 下一步提示</button><button id="maplisten">🔊 聽句子</button><button id="mapreset">↺ 重走</button></div><div id="nextarea"></div><ol id="history" class="log"></ol></section></div>';$('#rearrange').onclick=()=>resetMap(true);$('#destination').onchange=e=>{target=+e.target.value;resetMap()};$('#mapmode').onchange=e=>{mapMode=e.target.value;resetMap()};$('#mapreset').onclick=()=>resetMap();$('#maplisten').onclick=()=>speak(mapMode==='follow'?instruction():'How can I get to the '+b.en+'?');$('#routehint').onclick=()=>{if(!mapBusy){let r=route(person,b);feedback(r.length?'下一步：'+cmds[r[0]]:'你已經抵達目的地！')}};document.querySelectorAll('[data-command]').forEach(e=>e.onclick=()=>mapAction(e.dataset.command))}
function mapAction(c){if(mapBusy)return;if(mapMode==='follow'&&c!==path[pathStep]){feedback('再看一次指令：'+instruction());speak(instruction());return}let n=move(person,c);if(!n){feedback(c==='go'?'前方無法直走。請在路口改變方向。':'這裡不是路口。請先直走到兩條路交會處，再轉彎。');return}mapBusy=true;let phrase=mapMode==='follow'?instruction():cmds[c];person=n;history.push(phrase);$('#history').innerHTML=history.map(p=>'<li>'+p+'</li>').join('');$('#history').scrollTop=$('#history').scrollHeight;$('#avatar').style.transform='translate('+(80+person.x*65)+'px,'+(80+person.y*65)+'px)';$('#facearrow').style.transform='rotate('+(person.d*90)+'deg)';$('#facing').textContent='面向 '+facing[person.d];speak(phrase);if(mapMode==='follow'){pathStep++;$('#instruction').textContent=instruction()}feedback(c==='go'?'往前走了一小段。':'轉向完成，現在面向'+facing[person.d]+'。');let nEpoch=epoch;setTimeout(()=>{if(nEpoch!==epoch)return;mapBusy=false;let b=buildings[target];if(person.x===b.x&&person.y===b.y){mapBusy=true;feedback('🎉 You are at the '+b.en+'! 已抵達'+b.zh+'。');$('#routehint').disabled=true;$('#nextarea').innerHTML='<button class="primary" id="mapnext">換一個目的地 →</button>';$('#mapnext').onclick=()=>{target=(target+1)%buildings.length;resetMap()}}else if(mapMode==='follow')speak(instruction())},320)}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'🔊 發音開':'🔇 發音關';$('#sound').setAttribute('aria-pressed',String(sound));if(!sound&&'speechSynthesis'in window)speechSynthesis.cancel()};switchTab('fill');
</script></body></html>
